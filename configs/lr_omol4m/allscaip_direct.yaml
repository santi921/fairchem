# Phase 1: AllScAIP-small (6 layers, 512 hidden) trained from scratch on
# OMol-4M with direct forces. Select the LR arm with allscaip_lr:
#   fairchem -c configs/lr_omol4m/allscaip_direct.yaml allscaip_lr=coulomb
# Arms: none, coulomb, coulomb_6A, coulomb_heis
# Then finetune conservatively with allscaip_conserve.yaml (same arm).
defaults:
  - cluster: perlmutter
  - dataset: omol_4M
  - element_refs: omol_hof_lin_refs
  - tasks: omol
  - phase: direct
  - allscaip_lr: coulomb
  - common
  - _self_

job:
  run_name: allscaip_omol4m_${allscaip_lr.name}_direct_s${seed}
  logger:
    group: allscaip_direct

max_atoms: 350
cutoff_radius: 6.0
dataset_list: ["omol"]
knn_k: 30
knn_pad_size: 50

backbone:
  model: fairchem.core.models.allscaip.AllScAIP.AllScAIPBackbone
  num_layers: 6
  hidden_size: 512
  direct_forces: true
  regress_forces: true
  regress_stress: false
  # direct forces pad nodes to max_atoms; compile is untested with the LR
  # heads, so every arm runs uncompiled to share one execution path
  use_compile: false
  use_padding: true
  dataset_list: ${dataset_list}
  use_node_path: true
  use_freq_mask: false
  use_sincx_mask: false
  max_num_elements: 110
  max_batch_size: 96
  max_atoms: ${max_atoms}
  max_radius: ${cutoff_radius}
  knn_k: ${knn_k}
  knn_soft: true
  knn_sigmoid_scale: 0.2
  knn_lse_scale: 0.1
  knn_use_low_mem: true
  knn_pad_size: ${knn_pad_size}
  atten_name: memory_efficient
  atten_num_heads: 8

model:
  _target_: fairchem.core.models.base.HydraModel
  backbone: ${backbone}
  # allscaip_conserve.yaml carries the omol_energy head's weights over
  heads: ${allscaip_lr.direct_heads}
  pass_through_head_outputs: false
